# Vai trò của file : 
#định nghĩa toàn bộ hệ thống ứng dụng (service) chạy cùng lúc trong nhiều container.
# bao gồm 5 service : db,migrate, seed, api(backend),web(frontend )
# giúp việc chạy toàn bộ service chỉ bằng câu lệnh docker compose up 
# mà ko cần thủ công : khởi động DB, chạy BE,FE, Setup Migration, seed 

# Image cho PostgreSQL 
services:
  db:       # Mặc định trong Docker, db là Database
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: enterprise_copilot
      POSTGRES_USER: enterprise_copilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enterprise_copilot}  # có nghĩa là Docker sẽ đọc biến Pg Password trong file env để gán vào đây, nếu ko có biến đó thì sẽ lấy mặc định là enterprise copilot 
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # nghĩa là dữ liệu DB được giữ lại dù container restart

    # healthcheck là phần kiểm tra xem DB đã ready hay chưa   
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enterprise_copilot -d enterprise_copilot"]
      # nó sẽ test bằng cách chạy câu lệnh CMD này
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

# nhận xét : vậy Image đã tạo ra 1 cái khung, chứa tất cả những gì để thiết lập DB 
# bao gồm loại Image(postgresql), biến env (do docker ko đóng gói file env, nên khi khai báo Image nào đó, ta phải khai báo env riêng của image đó dùng), dà heath check

  migrate:      # Migrate là 1 service docker 
    build:       # Vì nó ko phải image có sẵn, nên nó phải được build từ ./backend
      context: ./backend    # giải thích : Image : postgres... : là bản image đóng gói sẵn, còn build là Docker tự tạo image dựa trên mã nguồn backend : nó sẽ đọc Dockerfile+src code để tạo ra Image cho migration
    # cụ thể docker sẽ vào ./backend, tìm file Dockerfile, copy các file cần thiết, cài dependencies,tạo image
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-Enterprise Copilot}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Ho_Chi_Minh}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://enterprise_copilot:${POSTGRES_PASSWORD:-enterprise_copilot}@db:5432/enterprise_copilot}
      # đường dẫn URL này thực tế dẫn chính đến cổng 5432 của máy local, chứ ko phải kết nối tới 1 địa chỉ cloud nào đó, và bản chất là Database Postgresql được lưu trong máy(server, chứ ko phải trên cloud)
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgresql+psycopg://enterprise_copilot:${POSTGRES_PASSWORD:-enterprise_copilot}@db:5432/enterprise_copilot}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/storage/uploads}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-enterprise_copilot_session}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:5173}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  seed:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-Enterprise Copilot}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://enterprise_copilot:${POSTGRES_PASSWORD:-enterprise_copilot}@db:5432/enterprise_copilot}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgresql+psycopg://enterprise_copilot:${POSTGRES_PASSWORD:-enterprise_copilot}@db:5432/enterprise_copilot}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.test}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_MANAGER_PASSWORD: ${SEED_MANAGER_PASSWORD:-}   
      SEED_EMPLOYEE_PASSWORD: ${SEED_EMPLOYEE_PASSWORD:-}   
    command: ["python", "-m", "app.scripts.seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully

# Image cho Backend 
  api:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-Enterprise Copilot}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Ho_Chi_Minh}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://enterprise_copilot:${POSTGRES_PASSWORD:-enterprise_copilot}@db:5432/enterprise_copilot}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgresql+psycopg://enterprise_copilot:${POSTGRES_PASSWORD:-enterprise_copilot}@db:5432/enterprise_copilot}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-enterprise_copilot_session}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:5173}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/storage/uploads}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - uploads_data:/app/storage/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

# Image cho Frontend 
  web:
    build:
      context: ./frontend        # Có nghĩa là nó sẽ đóng gói src code phần frontend vào context này
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  postgres_data:
  uploads_data:
